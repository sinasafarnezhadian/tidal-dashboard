<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Musik-Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Musik">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>🎶 Musik-Dashboard</h1>

    <div id="player" class="player" hidden>
      <div class="now-playing">
        <div id="np-title" class="np-title"></div>
        <div id="np-artist" class="np-artist"></div>
      </div>

      <div class="player-controls">
        <button id="prev-btn" class="ctrl-btn" aria-label="Vorheriger Titel">⏮</button>
        <button id="play-pause-btn" class="ctrl-btn play-btn" aria-label="Play/Pause">▶</button>
        <button id="next-btn" class="ctrl-btn" aria-label="Nächster Titel">⏭</button>
      </div>

      <div class="progress-row">
        <span id="time-current" class="time">0:00</span>
        <input id="seek" class="seek" type="range" min="0" max="0" value="0" step="1"
               aria-label="Position im Titel">
        <span id="time-total" class="time">0:00</span>
      </div>

      <div id="player-status" class="player-status"></div>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <audio id="audio" playsinline preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
