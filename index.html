<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Musik-Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Musik">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div id="player" class="player" hidden>
      <div class="now-playing">
        <span id="np-title" class="np-title"></span>
        <span id="np-artist" class="np-artist"></span>
      </div>

      <div class="player-row">
        <button id="prev-btn" class="ctrl-btn" aria-label="Vorheriger Titel">⏮</button>
        <button id="play-pause-btn" class="ctrl-btn play-btn" aria-label="Play/Pause">▶</button>
        <button id="next-btn" class="ctrl-btn" aria-label="Nächster Titel">⏭</button>
        <span id="time-current" class="time">0:00</span>
        <input id="seek" class="seek" type="range" min="0" max="0" value="0" step="1"
               aria-label="Position im Titel">
        <span id="time-total" class="time">0:00</span>
        <button id="fav-btn" class="ctrl-btn heart-btn"
                aria-label="Zu Younes-Favoriten hinzufügen">♥</button>
      </div>

      <div id="player-status" class="player-status"></div>

      <ol id="queue-list" class="queue-list" hidden></ol>
      <button id="queue-toggle" class="queue-toggle" hidden
              aria-label="Titelliste ein-/ausklappen">▲</button>
    </div>
  </header>

  <main>
    <div id="collections" class="grid"></div>
    <hr id="favorites-divider" class="section-divider" hidden>
    <div id="favorites" class="track-list"></div>
    <hr id="discover-divider" class="section-divider" hidden>
    <div id="discover" class="grid"></div>
  </main>

  <footer class="footer">
    <button id="settings-btn" class="gear-btn" aria-label="Einstellungen">⚙</button>
  </footer>

  <!-- Kein <dialog>: das kennt Safari 12 noch nicht. -->
  <div id="settings-overlay" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-labelledby="sheet-title">
      <h2 id="sheet-title" class="sheet-title">Einstellungen</h2>

      <div id="pin-step">
        <p id="pin-hint" class="sheet-hint"></p>
        <label class="field">
          <span class="field-label">PIN</span>
          <input id="pin-input" class="input pin-input" type="password" inputmode="numeric"
                 pattern="[0-9]*" maxlength="4" autocomplete="off">
        </label>
        <label id="pin-repeat-field" class="field" hidden>
          <span class="field-label">PIN wiederholen</span>
          <input id="pin-repeat" class="input pin-input" type="password" inputmode="numeric"
                 pattern="[0-9]*" maxlength="4" autocomplete="off">
        </label>
      </div>

      <div id="settings-step" hidden>
        <label class="field field-check">
          <input id="set-discover" type="checkbox">
          <span class="field-label">Vorschläge zeigen (Discovery)</span>
        </label>

        <label class="field">
          <span class="field-label">Favoriten-Liste</span>
          <input id="set-favorites" class="input" type="text" autocomplete="off"
                 placeholder="Playlist-ID oder Tidal-Link">
        </label>

        <label class="field">
          <span class="field-label">Sichtbare Playlisten – eine pro Zeile</span>
          <textarea id="set-playlists" class="input textarea" rows="6"
                    placeholder="Playlist-ID, Album-Nummer oder Tidal-Link"></textarea>
        </label>

        <fieldset class="field fieldset">
          <legend class="field-label">Explizit-Filter</legend>
          <label class="radio-row">
            <input type="radio" name="explicit" id="set-explicit-on" value="on">
            <span>Filter aktiv – anstößige Titel werden übersprungen</span>
          </label>
          <label class="radio-row">
            <input type="radio" name="explicit" id="set-explicit-off" value="off">
            <span>Filter deaktiviert</span>
          </label>
        </fieldset>
      </div>

      <p id="sheet-status" class="sheet-status"></p>

      <div class="sheet-buttons">
        <button id="sheet-cancel" class="sheet-btn">Abbrechen</button>
        <button id="sheet-ok" class="sheet-btn sheet-btn-main">Weiter</button>
      </div>
    </div>
  </div>

  <audio id="audio" playsinline preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
